# /etc/nginx/sites-available/ispops
# aktifkan:  ln -s /etc/nginx/sites-available/ispops /etc/nginx/sites-enabled/ && nginx -t && systemctl reload nginx
#
# Catatan: aplikasi di-bind ke 127.0.0.1 saja (lihat ispops.service),
# jadi hanya bisa diakses lewat nginx ini. Aman untuk dipasang di VPS publik.

server {
    listen 80;
    server_name ops.domainanda.com;   # <-- ganti, atau pakai IP server

    client_max_body_size 8m;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;   # scan ONU bisa lama
    }
}

# --- HTTPS (disarankan, jalankan setelah domain mengarah ke server) ---
